name: lint_python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: 
  contents: read

jobs:
  lint_python:
    name: "Lint and code analysis"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Micromamba
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
      with:
        environment-name: lint
        condarc: |
          channels:
            - conda-forge
        create-args: >-
          python=3.13
        cache-downloads: true

    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install lint dependencies
      run: |
        uv pip install --prefix "$CONDA_PREFIX" --group lint -e .
        micromamba info
        uv pip list --prefix "$CONDA_PREFIX"

    - name: Spell check
      run: codespell mir_eval

    - name: Linting check
      run: ruff check --output-format=github mir_eval tests

    - name: Formatting check
      run: ruff format --check mir_eval tests

    - name: Docstring formatting check
      run: numpydoc lint mir_eval/*.py
