name: CI Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: True

jobs:
  docs:
    name: "Doc environment setup"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-name: docs
          condarc: |
            channels:
              - conda-forge
          create-args: >-
            python=3.13
          cache-downloads: true

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install mir_eval and doc dependencies
        run: |
          uv pip install --prefix "$CONDA_PREFIX" -e ".[docs]"
          micromamba info
          uv pip list --prefix "$CONDA_PREFIX"

      - name: Build docs
        working-directory: docs
        run: make html

      - name: Link checking
        id: linkcheck
        working-directory: docs
        run: make linkcheck
